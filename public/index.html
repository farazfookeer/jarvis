<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before the page paints, so it never flashes teal first.
  try { var t = JSON.parse(localStorage.getItem("jarvis:theme")); if (t === "mark" || t === "graphite") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <section class="col left-col" aria-label="Email">
    <div class="sec">
      <div class="head"><span class="lbl">Inbox</span><span class="cnt" id="unread"></span><span class="rule"></span><span class="cnt" id="inboxStamp"></span><button class="lnk" id="inboxRefresh">Refresh</button></div>
      <div class="list" id="inbox"><div class="msg">Connecting to Gmail.</div></div>
    </div>
    <div class="sec">
      <div class="head"><span class="lbl">Reminders</span><span class="cnt" id="remCnt"></span><span class="rule"></span></div>
      <div class="list ruled" id="reminders"><div class="msg">Loading reminders.</div></div>
    </div>
  </section>

  <section class="col center" aria-label="Jarvis">
    <div class="dial" id="dial">
      <svg viewBox="0 0 560 440" aria-hidden="true">
        <defs>
          <radialGradient id="discG" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="var(--glow)" stop-opacity=".09"/>
            <stop offset="75%" stop-color="var(--glow)" stop-opacity=".03"/>
            <stop offset="100%" stop-color="var(--glow)" stop-opacity=".12"/>
          </radialGradient>
        </defs>
        <g id="static"></g>
        <circle class="halo" cx="280" cy="215" r="176"/>
        <g id="dyn"></g>
        <g class="spin"><circle class="seg" cx="280" cy="215" r="120"/></g>
        <g class="spin rev"><circle class="seg2" cx="280" cy="215" r="131"/></g>
        <circle class="disc" cx="280" cy="215" r="112"/>
      </svg>
      <div class="hub">
        <div class="big"><span id="done">0</span><span class="of">/<span id="total">0</span></span></div>
        <div class="cap" id="cap">events done today</div>
        <div class="lb" id="nowLbl">Now</div>
        <div class="now" id="nowTitle">Clear</div>
        <div class="when" id="nowWhen"></div>
        <div class="mode" id="status" role="status" aria-live="polite">Ready</div>
        <div class="foot" id="hubFoot"></div>
      </div>
    </div>

    <div class="stats">
      <div><div class="clock" id="clock">--:--</div><div class="small" id="date"></div></div>
      <div class="wx"><div class="tp"><span id="wxT">--°</span><span class="loc" id="wxLoc">London</span></div><div class="cd" id="wxC">Weather loading</div></div>
      <div class="bars">
        <span>Next</span><span class="pc" id="nx" style="grid-column:span 2;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px">--:--</span>
        <span>Day</span><span class="bar"><i id="dayBar" style="width:0"></i></span><span class="pc" id="dayPc">0%</span>
        <span>Inbox</span><span class="bar"><i id="mailBar" style="width:0"></i></span><span class="pc" id="mailPc">0</span>
        <span>Tube</span><button class="pc tube" id="tube" style="grid-column:span 2" title="London travel status from TfL">--</button>
      </div>
    </div>

    <div class="fc" id="fc" hidden></div>

    <div class="console">
      <div class="hint" id="hint">Ready when you are.</div>
      <div class="cmd">
        <button class="ib" id="mic" title="Speak" aria-label="Speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <label class="sr" for="ask">Ask Jarvis</label>
        <textarea id="ask" rows="1" placeholder="Ask Jarvis"></textarea>
        <button class="ib go" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="opts">
        <div class="seg-tabs" role="tablist">
          <button role="tab" aria-selected="true" data-mode="talk">Talk</button>
          <button role="tab" aria-selected="false" data-mode="brainstorm">Brainstorm</button>
        </div>
        <button class="tg" id="voiceToggle" aria-pressed="true"><span>Voice on</span></button>
        <button class="tg" id="handsFree" aria-pressed="false"><span>Hands-free off</span></button>
        <label class="sr" for="voicePick">Voice</label>
        <select id="voicePick" hidden style="max-width:150px;background:var(--field);color:var(--ink-2);border:1px solid var(--line);border-radius:3px;font-size:11.5px;padding:2px 4px"></select>
        <button class="tg" id="voiceTest" hidden aria-pressed="false" style="padding-left:0">Test</button>
        <button class="tg" id="dictate" aria-pressed="false" hidden title="Use your computer's dictation; Jarvis sends when you pause"><span>Dictation mode off</span></button>
        <button class="tg" id="coreStyle" aria-pressed="true" title="Turn the animated particles on or off"><span>Particles on</span></button>
        <div class="swatches" role="radiogroup" aria-label="Theme">
          <button role="radio" aria-checked="true" data-theme-pick="arc" title="Arc: teal" aria-label="Arc theme, teal"></button>
          <button role="radio" aria-checked="false" data-theme-pick="mark" title="Mark: red and black" aria-label="Mark theme, red and black"></button>
          <button role="radio" aria-checked="false" data-theme-pick="graphite" title="Graphite: light grey and black" aria-label="Graphite theme, light grey and black"></button>
        </div>
        <span class="brand">Jarvis</span>
      </div>
    </div>
  </section>

  <section class="col right-col" aria-label="Schedule and conversation">
    <div class="sec">
      <div class="head"><span class="rule"></span><span class="lbl">Today</span><span class="cnt" id="todayCnt"></span><span class="cnt" id="calStamp"></span><button class="lnk" id="calRefresh">Refresh</button></div>
      <div class="list" id="cal"><div class="msg">Connecting to Google Calendar.</div></div>
    </div>
    <div class="sec news">
      <div class="head"><span class="rule"></span><span class="lbl">AI &amp; Tech</span><span class="cnt" id="newsCnt"></span><span class="cnt" id="newsStamp"></span></div>
      <div class="list" id="news"><div class="msg">Loading headlines.</div></div>
    </div>
    <div class="sec">
      <div class="head"><span class="rule"></span><span class="lbl" id="wzLbl">Jarvis</span><span class="cnt" id="wzCnt">talk</span><button class="lnk" id="wzTool" hidden></button></div>
      <div class="list log" id="log">
        <div class="starters" id="starters">
          <button data-q="Brief me on today: anything important in my inbox and what's on my calendar.">Brief me on today</button>
          <button data-q="Which emails from the last few days actually need a reply from me?">What needs a reply?</button>
          <button data-q="When am I free this week for a two hour deep work block?">Find me a free block this week</button>
          <button data-q="What are the most important AI and tech stories today, and why do they matter to me?">What's happening in AI?</button>
        </div>
      </div>
      <div class="list" id="board" hidden></div>
    </div>
  </section>
</div>
<script src="claude-shim.js"></script>
<script src="voice-engine.js"></script>
<script src="core-viz.js"></script>
<script src="app.js"></script>
<script src="mail-view.js"></script>
<script src="cal-view.js"></script>
</body>
</html>
